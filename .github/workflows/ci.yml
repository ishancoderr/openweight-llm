name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Python 3.10 = the python3 of the server's Ubuntu 22.04 image.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies (no GPU build)
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

      - name: Check shell script syntax
        run: bash -n setup_ec2.sh && bash -n prepare_model.sh

      - name: Check docker-compose.yml
        run: cp .env.example .env && docker compose config --quiet
